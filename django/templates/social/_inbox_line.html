{% load vd %}
<div class="msg-line">
    <a href="{% url 'profile' m.social_user.id %}"><b>{{ m.social_user.name }}</b></a>
    {% if m.created_at %}<span class="muted msg-time"> · {{ m.created_at|date:"j E, H:i" }}</span>{% endif %}
    {% if m.social_user_id == me.id %}
    <form method="post" action="{% url 'messages.delete' m.id %}" class="inline msg-del">{% csrf_token %}
        <input type="hidden" name="next" value="{% url 'inbox' %}?c={{ active.id }}">
        <button type="submit" class="linkish muted">удалить</button>
    </form>
    {% endif %}
    <div class="msg-body">
        {% if m.body and m.body != '[фото]' %}{{ m.body|linebreaksbr }}{% endif %}
        {% if m.attachment_url %}<p><img src="{{ m.attachment_url }}" alt="" class="msg-photo"></p>{% endif %}
    </div>
</div>
