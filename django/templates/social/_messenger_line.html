{% load vd %}
<div class="chat-line{% if m.social_user_id == me.id %} is-mine{% endif %}" data-id="{{ m.id }}">
    <a href="{% url 'profile' m.social_user.id %}"><b>{{ m.social_user.name }}</b></a>
    {% if m.created_at %}<span class="muted chat-time"> · {{ m.created_at|date:"j E, H:i" }}</span>{% endif %}
    {% if m.social_user_id == me.id %}
    <form method="post" action="{% url 'messages.delete' m.id %}" class="inline msg-del" data-ajax="1">{% csrf_token %}
        <input type="hidden" name="next" value="{% url 'messenger' %}?c={{ active.id }}">
        <button type="submit" class="linkish muted" title="Удалить">×</button>
    </form>
    {% endif %}
    <div class="chat-body">
        {% if m.body and m.body != '[фото]' %}{{ m.body|linebreaksbr }}{% endif %}
        {% if m.attachment_url %}<p><img src="{{ m.attachment_url }}" alt="" class="chat-photo"></p>{% endif %}
    </div>
</div>
