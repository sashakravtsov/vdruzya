{# Floated wall/group media. Click opens full image (FB 2006: no lightbox). #}
{% with extras=post.media.all %}
{% if extras %}
<div class="wall-media">
    {% for m in extras %}{% if m.url %}<a href="{{ m.url }}" target="_blank" rel="noopener"><img src="{{ m.url }}" alt=""></a>{% endif %}{% endfor %}
</div>
{% elif post.media_url %}
<p><a href="{{ post.media_url }}" target="_blank" rel="noopener"><img src="{{ post.media_url }}" alt="" class="news-photo"></a></p>
{% endif %}
{% endwith %}
