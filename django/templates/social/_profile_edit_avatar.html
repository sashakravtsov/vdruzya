<div id="picture">
    <div id="currentpicture">
        <h4>Текущее фото</h4>
        {% if me.avatar_url %}
        <img src="{{ me.avatar_url }}" alt="" width="200" height="200">
        <form method="post" action="{% url 'profile.avatar.clear' %}" class="avatar-clear">{% csrf_token %}
            <button type="submit" class="linkish muted">Удалить фото</button>
        </form>
        {% else %}
        <div id="nopicture">нет фото</div>
        {% endif %}
    </div>
    <div id="uploadpicture">
        <h4>Загрузить новое фото</h4>
        <form method="post" action="{% url 'profile.avatar' %}" enctype="multipart/form-data">{% csrf_token %}
            <input type="file" name="avatar" accept="image/jpeg,image/png,image/gif" class="inputfile">
            <small>JPEG, PNG или GIF · до 2 МБ. Квадратное фото смотрится лучше.</small>
            <p><input type="submit" class="inputsubmit" value="Загрузить"></p>
        </form>
    </div>
    <div class="clear"></div>
</div>
