<div class="profile-box" id="avatar">
    <h4>Фото профиля</h4>
    <div class="profile-box-body">
        <form method="post" action="{% url 'profile.avatar' %}" enctype="multipart/form-data">{% csrf_token %}
            <table class="formtable" cellpadding="0" cellspacing="0">
                <tr>
                    <td class="label">Сейчас:</td>
                    <td>
                        {% if me.avatar_url %}
                        <img src="{{ me.avatar_url }}" alt="" class="avatar-edit-preview">
                        {% else %}
                        <span class="muted">нет фото</span>
                        {% endif %}
                    </td>
                </tr>
                <tr>
                    <td class="label">Новое:</td>
                    <td>
                        <input type="file" name="avatar" accept="image/jpeg,image/png,image/gif,image/webp" class="inputfile" required>
                        <div class="file-hint muted">JPEG, PNG или GIF · до 2 МБ</div>
                    </td>
                </tr>
                <tr><td></td><td><input type="submit" class="inputsubmit" value="Сменить фото"></td></tr>
            </table>
        </form>
        {% if me.avatar_url %}
        <form method="post" action="{% url 'profile.avatar.clear' %}" class="avatar-clear">{% csrf_token %}
            <button type="submit" class="linkish muted">Удалить фото</button>
        </form>
        {% endif %}
    </div>
</div>
