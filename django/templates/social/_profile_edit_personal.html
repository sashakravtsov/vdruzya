<div class="profile-box">
    <h4>Личная информация</h4>
    <div class="profile-box-body">
        <table class="formtable editor" cellpadding="0" cellspacing="0">
            <tr><td class="label">О себе:</td><td>{{ form.bio }}</td></tr>
            <tr><td class="label">Интересы:</td><td>{{ form.interests }}</td></tr>
            <tr><td class="label">Хобби:</td><td>{{ form.hobbies }}</td></tr>
            <tr><td class="label">Музыка:</td><td>{{ form.favorite_music }}</td></tr>
            <tr><td class="label">Фильмы:</td><td>{{ form.favorite_movies }}</td></tr>
            <tr><td class="label">ТВ:</td><td>{{ form.favorite_tv }}</td></tr>
            <tr><td class="label">Книги:</td><td>{{ form.favorite_books }}</td></tr>
            <tr><td class="label">Игры:</td><td>{{ form.favorite_games }}</td></tr>
            <tr><td class="label">Цитаты:</td><td>{{ form.favorite_quotes }}</td></tr>
        </table>
    </div>
</div>
