<div class="profile-box">
    <h4>Приватность</h4>
    <div class="profile-box-body">
        <p class="profile_note">Ограниченный профиль скрывает стену и подробности от тех, кто не в друзьях. Пароль и email — в <a href="{% url 'account' %}">Мой аккаунт</a>.</p>
        <table class="formtable editor" cellpadding="0" cellspacing="0">
            <tr><td class="label">Профиль:</td><td>{{ form.profile_visibility }}</td></tr>
            <tr><td class="label">Стена (просмотр):</td><td>{{ form.wall_view }}</td></tr>
            <tr><td class="label">Стена (запись):</td><td>{{ form.wall_write }}</td></tr>
        </table>
    </div>
</div>
