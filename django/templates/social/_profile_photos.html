<div class="profile-box">
    <h4>Фото{% if is_own %} <a class="edit" href="{% url 'albums' %}">[ред.]</a>{% else %} <a class="edit" href="{% url 'profile.albums' profile.id %}">все альбомы</a>{% endif %}</h4>
    <div class="profile-box-body profile-photo-thumbs" id="photos">
        {% for ph in photos %}
        <a href="{% url 'albums.photos.show' ph.album_id ph.id %}" title="{{ ph.title }}">
            {% if ph.url %}<img src="{{ ph.url }}" alt="">{% else %}<span class="album-cover-fallback">·</span>{% endif %}
        </a>
        {% empty %}
        <p class="muted">Фотографий пока нет.</p>
        {% endfor %}
        <div class="clear"></div>
    </div>
</div>
