{% extends "layout.html" %}
{% load vd %}
{% block title %}{{ app.name }} — App Center — ВДрузья{% endblock %}
{% block pagebody %}
<div id="pagebody" class="groups-index">
    <div id="header" class="withsubtitle">
        <h1>{{ app.name }}</h1>
        <div class="subtitle"><a href="{% url 'apps' %}">← App Center</a></div>
    </div>
    <div id="content">
        {% include "partials/flash.html" %}
        <div class="profile-box">
            <h4>О приложении</h4>
            <div class="profile-box-body">
                <p>{{ app.detail }}</p>
                <p class="muted">{{ app.blurb }}</p>
                <p>
                    <a class="inputsubmit" href="{% url app.url_name %}" style="padding:4px 10px;text-decoration:none">Открыть</a>
                    · <a href="{% url 'apps' %}">все приложения</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
