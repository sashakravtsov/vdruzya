{% extends "social/apps/canvas_base.html" %}
{% block canvas_body %}
<div class="profile-box">
    <h4>Супер-подмигивание</h4>
    <div class="profile-box-body">
        {% if friends %}
        <form method="post">{% csrf_token %}
            <table class="formtable" cellspacing="0">
                <tr>
                    <td class="label">Друг:</td>
                    <td>
                        <select name="friend_id" class="inputtext">
                            {% for f in friends %}
                            <option value="{{ f.id }}">{{ f.name }}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label">Как:</td>
                    <td>
                        <select name="poke_type" class="inputtext">
                            {% for val, lab in poke_types %}
                            <option value="{{ val }}">{{ lab }}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr><td></td><td><input type="submit" class="inputsubmit" value="Отправить"></td></tr>
            </table>
        </form>
        {% else %}
        <p class="muted">Нужны друзья, чтобы подмигивать. <a href="{% url 'people' %}?tab=search">Найти друзей</a></p>
        {% endif %}
    </div>
</div>
{% endblock %}
