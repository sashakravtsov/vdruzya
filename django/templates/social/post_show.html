{% extends "layout.html" %}
{% load vd %}
{% block title %}Запись — ВДрузья{% endblock %}
{% block pagebody %}
<div id="pagebody" class="feed-page">
    <div id="header"><h1>Запись</h1></div>
    <div id="content" class="wall-box">
        <div class="profile-box wall-box">
            <h4>Стена</h4>
            <div class="profile-box-body">
                {% include "social/_wall_post.html" with post=post me=me comment_form=comment_form next=request.path %}
                <p class="muted"><a href="{% url 'feed' %}">← к ленте</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
